# MusicVerse local development stack.
#   pnpm docker:up     (or: docker compose -f infrastructure/docker/docker-compose.yml up -d --build)
# Web http://localhost:3000 · Admin http://localhost:3001 · API http://localhost:4000/api/docs
# Mailpit (captures all email) http://localhost:8025
#
# All credentials below are DEVELOPMENT-ONLY placeholders. Never reuse them anywhere else.
# Behind a registry mirror, override images, e.g. NODE_IMAGE=mirror.gcr.io/library/node:22-alpine.
name: musicverse

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgresql://musicverse:musicverse@postgres:5432/musicverse?schema=public
  REDIS_URL: redis://redis:6379/0
  JWT_ACCESS_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
  MFA_ENCRYPTION_KEY: ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy1sb25nISE=
  WEB_APP_URL: http://localhost:3000
  CORS_ORIGINS: http://localhost:3000,http://localhost:3001
  COOKIE_SECURE: "false"
  MAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@musicverse.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-this-dev-password}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: musicverse
      POSTGRES_PASSWORD: musicverse
      POSTGRES_DB: musicverse
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicverse -d musicverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    ports: ["${MAILPIT_SMTP_PORT:-1025}:1025", "${MAILPIT_UI_PORT:-8025}:8025"]

  migrate:
    init: true
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      args: { NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" }
    image: musicverse-api:dev
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/database/seed.js"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    init: true
    image: musicverse-api:dev
    environment: *api-env
    ports: ["${API_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  web:
    init: true
    build:
      context: ../..
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args: { APP: web, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" }
    image: musicverse-web:dev
    environment:
      PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

  admin:
    init: true
    build:
      context: ../..
      dockerfile: infrastructure/docker/next-app.Dockerfile
      args: { APP: admin, NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}" }
    image: musicverse-admin:dev
    environment:
      PUBLIC_API_URL: http://localhost:${API_PORT:-4000}/api/v1
    ports: ["${ADMIN_PORT:-3001}:3000"]
    depends_on: [api]

volumes:
  postgres-data:
  redis-data:
