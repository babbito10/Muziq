# Render Blueprint — MusicVerse preview deployment (single container: web + API + admin).
# Render → New → Blueprint → pick this repository (and branch). It creates:
#   - musicverse        web service (Docker) — the app at https://<name>.onrender.com,
#                       admin console at /admin, API at /api/v1, API docs at /api/docs
#   - musicverse-db     PostgreSQL
#   - musicverse-redis  Key Value (Redis-compatible), private
# Free-tier notes: the web service sleeps after ~15 idle minutes (first request then takes about a
# minute) and Render's free PostgreSQL expires after 30 days — upgrade plans before real use.
services:
  - type: web
    name: musicverse
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infrastructure/docker/allinone.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: musicverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: musicverse-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      # No email provider yet: emails are NOT sent (the app says so). To enable email, set
      # MAIL_TRANSPORT=smtp plus SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM.
      - key: MAIL_TRANSPORT
        value: none
      # Your first administrator (password: at least 10 characters). Sign in at /admin.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: musicverse-redis
    plan: free
    region: frankfurt
    ipAllowList: [] # private network only
    maxmemoryPolicy: noeviction

databases:
  - name: musicverse-db
    plan: free
    region: frankfurt
    databaseName: musicverse
    user: musicverse
